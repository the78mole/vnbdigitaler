<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BDEW VNB Digitaler Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="/static/js/admin_dashboard.js"></script>
  </head>

  <body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8" x-data="dashboard()" x-init="init()">
      <!-- Header -->
      <div class="mb-8">
        <h1 class="text-3xl font-bold text-gray-900">BDEW VNB Digitaler Admin</h1>
        <p class="text-gray-600 mt-2">Verwaltung der BDEW-Datenbank</p>
      </div>

      <!-- Stats Cards -->
      <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
        <div class="bg-white rounded-lg shadow p-6">
          <div class="flex items-center">
            <div class="p-2 bg-blue-500 rounded-lg">
              <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"
                ></path>
              </svg>
            </div>
            <div class="ml-4">
              <p class="text-sm font-medium text-gray-600">Unternehmen</p>
              <p
                class="text-2xl font-semibold text-gray-900"
                x-text="stats.total_companies || 0"
              ></p>
            </div>
          </div>
        </div>

        <div class="bg-white rounded-lg shadow p-6">
          <div class="flex items-center">
            <div class="p-2 bg-green-500 rounded-lg">
              <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
                ></path>
              </svg>
            </div>
            <div class="ml-4">
              <p class="text-sm font-medium text-gray-600">BDEW-Codes</p>
              <p class="text-2xl font-semibold text-gray-900" x-text="stats.total_codes || 0"></p>
            </div>
          </div>
        </div>

        <div class="bg-white rounded-lg shadow p-6">
          <div class="flex items-center">
            <div class="p-2 bg-yellow-500 rounded-lg">
              <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 100 4m0-4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 100 4m0-4v2m0-6V4"
                ></path>
              </svg>
            </div>
            <div class="ml-4">
              <p class="text-sm font-medium text-gray-600">Marktfunktionen</p>
              <p
                class="text-2xl font-semibold text-gray-900"
                x-text="stats.total_functions || 0"
              ></p>
            </div>
          </div>
        </div>

        <div class="bg-white rounded-lg shadow p-6">
          <div class="flex items-center">
            <div class="p-2 bg-purple-500 rounded-lg">
              <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
                ></path>
              </svg>
            </div>
            <div class="ml-4">
              <p class="text-sm font-medium text-gray-600">Letzte Sync</p>
              <p class="text-2xl font-semibold text-gray-900" x-text="stats.last_sync || 'Nie'"></p>
            </div>
          </div>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <div class="bg-white rounded-lg shadow mb-6">
        <div class="border-b border-gray-200">
          <nav class="-mb-px flex space-x-8">
            <button
              @click="showTab('companies')"
              :class="activeTab === 'companies' ? 'border-blue-500 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'"
              class="whitespace-nowrap py-2 px-1 border-b-2 font-medium text-sm"
            >
              Unternehmen
            </button>
            <button
              @click="showTab('codes')"
              :class="activeTab === 'codes' ? 'border-blue-500 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'"
              class="whitespace-nowrap py-2 px-1 border-b-2 font-medium text-sm"
            >
              BDEW-Codes
            </button>
            <button
              @click="showTab('functions')"
              :class="activeTab === 'functions' ? 'border-blue-500 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'"
              class="whitespace-nowrap py-2 px-1 border-b-2 font-medium text-sm"
            >
              Marktfunktionen
            </button>
          </nav>
        </div>

        <!-- Companies Tab -->
        <div x-show="activeTab === 'companies'" class="p-6">
          <h2 class="text-lg font-medium text-gray-900 mb-4">Unternehmen</h2>
          <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
              <thead class="bg-gray-50">
                <tr>
                  <th
                    class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                  >
                    Firmenname
                  </th>
                  <th
                    class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                  >
                    Anzahl Codes
                  </th>
                </tr>
              </thead>
              <tbody class="bg-white divide-y divide-gray-200">
                <template x-for="company in companies" :key="company.company_name">
                  <tr
                    @click="showCompanyDetails(company.company_name)"
                    class="hover:bg-gray-50 cursor-pointer"
                  >
                    <td
                      class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900"
                      x-text="company.company_name"
                    ></td>
                    <td
                      class="px-6 py-4 whitespace-nowrap text-sm text-gray-500"
                      x-text="company.total_codes"
                    ></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>

        <!-- BDEW Codes Tab -->
        <div x-show="activeTab === 'codes'" class="p-6">
          <h2 class="text-lg font-medium text-gray-900 mb-4">BDEW-Codes</h2>
          <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
              <thead class="bg-gray-50">
                <tr>
                  <th
                    class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                  >
                    Unternehmen
                  </th>
                  <th
                    class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                  >
                    BDEW Code
                  </th>
                  <th
                    class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                  >
                    Marktfunktion
                  </th>
                </tr>
              </thead>
              <tbody class="bg-white divide-y divide-gray-200">
                <template x-for="code in codes" :key="code.bdew_code">
                  <tr class="hover:bg-gray-50">
                    <td
                      class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900"
                      x-text="code.company_name"
                    ></td>
                    <td
                      class="px-6 py-4 whitespace-nowrap text-sm text-gray-500"
                      x-text="code.bdew_code"
                    ></td>
                    <td
                      class="px-6 py-4 whitespace-nowrap text-sm text-gray-500"
                      x-text="code.market_function || '-'"
                    ></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Market Functions Tab -->
        <div x-show="activeTab === 'functions'" class="p-6">
          <h2 class="text-lg font-medium text-gray-900 mb-4">Marktfunktionen</h2>
          <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
              <thead class="bg-gray-50">
                <tr>
                  <th
                    class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                  >
                    Funktionsname
                  </th>
                  <th
                    class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                  >
                    Code
                  </th>
                  <th
                    class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                  >
                    Beschreibung
                  </th>
                </tr>
              </thead>
              <tbody class="bg-white divide-y divide-gray-200">
                <template x-for="func in functions" :key="func.function_code">
                  <tr class="hover:bg-gray-50">
                    <td
                      class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900"
                      x-text="func.function_name"
                    ></td>
                    <td
                      class="px-6 py-4 whitespace-nowrap text-sm text-gray-500"
                      x-text="func.function_code"
                    ></td>
                    <td
                      class="px-6 py-4 whitespace-nowrap text-sm text-gray-500"
                      x-text="func.description || '-'"
                    ></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Company Details Modal -->
      <div
        x-show="showModal"
        class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50"
        @click="closeModal()"
      >
        <div
          class="relative top-20 mx-auto p-5 border w-11/12 md:w-3/4 lg:w-1/2 shadow-lg rounded-md bg-white"
          @click.stop
        >
          <div class="mt-3">
            <div class="flex justify-between items-center mb-4">
              <h3 class="text-lg font-semibold text-gray-900">
                Unternehmensdetails: <span x-text="selectedCompany || ''"></span>
              </h3>
              <button @click="closeModal()" class="text-gray-400 hover:text-gray-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M6 18L18 6M6 6l12 12"
                  ></path>
                </svg>
              </button>
            </div>

            <template x-if="companyDetails">
              <div class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                  <div>
                    <strong class="text-gray-700">Firmenname:</strong>
                    <p x-text="companyDetails.company_name" class="mt-1"></p>
                  </div>
                  <div>
                    <strong class="text-gray-700">Anzahl BDEW-Codes:</strong>
                    <p x-text="companyDetails.total_codes" class="mt-1"></p>
                  </div>
                  <div>
                    <strong class="text-gray-700">Status:</strong>
                    <p x-text="companyDetails.status" class="mt-1"></p>
                  </div>
                </div>

                <div>
                  <strong class="text-gray-700">BDEW-Codes:</strong>
                  <div class="mt-2 overflow-x-auto">
                    <table class="min-w-full bg-white border border-gray-200">
                      <thead class="bg-gray-50">
                        <tr>
                          <th
                            class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase"
                          >
                            BDEW Code
                          </th>
                          <th
                            class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase"
                          >
                            Marktfunktion
                          </th>
                          <th
                            class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase"
                          >
                            Status
                          </th>
                        </tr>
                      </thead>
                      <tbody>
                        <template x-for="code in companyDetails.codes" :key="code.bdew_code">
                          <tr class="border-b">
                            <td class="px-4 py-2 text-sm font-medium" x-text="code.bdew_code"></td>
                            <td class="px-4 py-2 text-sm" x-text="code.market_function || '-'"></td>
                            <td class="px-4 py-2 text-sm" x-text="code.status"></td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </template>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
