#Run static analysis and linting
# mostly identical with local pre-commit hook
name: Static checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv (GitHub Actions)
        if: ${{ !env.ACT }}
        uses: astral-sh/setup-uv@v6

      - name: Install uv (local act)
        if: ${{ env.ACT }}
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --all-extras

      - name: Set test environment variables
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/test_db" # pragma: allowlist secret
        run: |
          echo "DATABASE_URL=$DATABASE_URL" >> $GITHUB_ENV

      - name: Upgrade Node.js for act compatibility
        if: ${{ env.ACT }}
        run: |
          # Install Node.js 20 for act compatibility with markdownlint-cli
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs
          node --version
          npm --version

      - name: Run pre-commit checks
        run: |
          uv run pre-commit run --all-files

      - name: Run tests
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/test_db" # pragma: allowlist secret
        run: |
          if [ "${{ matrix.python-version }}" = "3.11" ]; then
            uv run coverage run -m pytest
            uv run coverage xml
          else
            uv run pytest
          fi

      - name: Upload coverage reports
        if: matrix.python-version == '3.11' && !env.ACT
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && !env.ACT }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv (GitHub Actions)
        if: ${{ !env.ACT }}
        uses: astral-sh/setup-uv@v6

      - name: Install uv (local act)
        if: ${{ env.ACT }}
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run security checks
        run: |
          uv run bandit -r src/
          uv run safety check --ignore 59234

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Deploy to Streamlit Cloud
        run: |
          echo "Deployment would happen here"
          # Streamlit Cloud deploys automatically on push to main
