name: BNetzA Rollout Update (Main Coordinator)

on:
  workflow_call:
    inputs:
      force_update:
        description: "Force update even if no changes detected"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Dry run - show what would be updated without making changes"
        required: false
        default: false
        type: boolean
      check_only:
        description: 'Only check for updates without performing them'
        required: false
        type: boolean
        default: false
      release_id:
        description: 'GitHub Release ID to upload files to'
        required: false
        type: string
        default: ''
      release_version:
        description: 'Release version tag'
        required: false
        type: string
        default: ''
    secrets:
      DATABASE_URL:
        description: 'Database connection URL'
        required: true
    outputs:
      action_taken:
        description: 'Description of the action taken'
        value: ${{ jobs.coordinate-rollout-update.outputs.action_taken }}
      companies_processed:
        description: 'Number of companies processed'
        value: ${{ jobs.coordinate-rollout-update.outputs.companies_processed }}
      companies_updated:
        description: 'Number of companies updated'
        value: ${{ jobs.coordinate-rollout-update.outputs.companies_updated }}
      companies_new:
        description: 'Number of new companies added'
        value: ${{ jobs.coordinate-rollout-update.outputs.companies_new }}
      quotas_total:
        description: 'Total number of quota records'
        value: ${{ jobs.coordinate-rollout-update.outputs.quotas_total }}

jobs:
  # New job: Download and upload source files first, independently
  download-and-upload-sources:
    name: Download & Upload Source Files
    if: ${{ inputs.check_only != 'true' && inputs.release_version != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python environment
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          uv sync --frozen

      - name: Download BNetzA rollout reports
        run: |
          echo "📥 Downloading rollout reports and converting to CSV..."
          uv run python src/data_loader.py --rollout-quota-update

      - name: Upload source files to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "📤 Uploading source files to release ${{ inputs.release_version }}..."

          # Upload Excel source files from data/ directory
          for file in data/Roll-out-Quoten_Q1_2025.xlsx data/*.xlsx; do
            if [[ -f "$file" ]]; then
              filename=$(basename "$file")
              echo "📄 Uploading: $filename"
              gh release upload "${{ inputs.release_version }}" "$file" --clobber || echo "Failed to upload $file"
            fi
          done

          # Upload CSV files from data/ directory
          for file in data/Roll-out-Quoten_Q1_2025.csv data/*.csv; do
            if [[ -f "$file" ]]; then
              filename=$(basename "$file")
              echo "📄 Uploading: $filename"
              gh release upload "${{ inputs.release_version }}" "$file" --clobber || echo "Failed to upload $file"
            fi
          done

          echo "✅ Source files uploaded to release"

  company-update:
    name: Update Company Data
    needs: [download-and-upload-sources]
    if: ${{ always() }}  # Run even if source upload fails
    uses: ./.github/workflows/reusable-rollout-company-update.yml
    with:
      force_update: ${{ inputs.force_update }}
      dry_run: ${{ inputs.dry_run }}
      check_only: ${{ inputs.check_only }}
      release_id: ${{ inputs.release_id }}
      release_version: ${{ inputs.release_version }}
    secrets:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

  quota-update:
    name: Update Quota Data
    needs: [download-and-upload-sources]
    if: ${{ always() }}  # Run even if source upload or company update fails
    uses: ./.github/workflows/reusable-rollout-quota-update.yml
    with:
      force_update: ${{ inputs.force_update }}
      dry_run: ${{ inputs.dry_run }}
      check_only: ${{ inputs.check_only }}
      release_id: ${{ inputs.release_id }}
      release_version: ${{ inputs.release_version }}
    secrets:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

  coordinate-rollout-update:
    name: Coordinate & Summarize
    needs: [download-and-upload-sources, company-update, quota-update]
    if: ${{ always() }}  # Run even if some jobs failed
    runs-on: ubuntu-latest
    outputs:
      action_taken: ${{ steps.create-summary.outputs.action_taken }}
      companies_processed: ${{ steps.create-summary.outputs.companies_processed }}
      companies_updated: ${{ steps.create-summary.outputs.companies_updated }}
      companies_new: ${{ steps.create-summary.outputs.companies_new }}
      quotas_total: ${{ steps.create-summary.outputs.quotas_total }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Create Combined Summary
        id: create-summary
        run: |
          # Combine results from all workflows
          SOURCE_UPLOAD_STATUS="${{ needs.download-and-upload-sources.result }}"
          COMPANY_ACTION_TAKEN="${{ needs.company-update.outputs.action_taken }}"
          QUOTA_ACTION_TAKEN="${{ needs.quota-update.outputs.action_taken }}"

          COMPANIES_PROCESSED="${{ needs.company-update.outputs.companies_processed || '0' }}"
          COMPANIES_UPDATED="${{ needs.company-update.outputs.companies_updated || '0' }}"
          COMPANIES_NEW="${{ needs.company-update.outputs.companies_new || '0' }}"

          QUOTAS_TOTAL="${{ needs.quota-update.outputs.quotas_total || '0' }}"
          QUOTAS_CURRENT="${{ needs.quota-update.outputs.quotas_current_date || '0' }}"
          QUOTAS_OUTDATED="${{ needs.quota-update.outputs.quotas_outdated_date || '0' }}"
          QUOTAS_ERRORS="${{ needs.quota-update.outputs.quotas_errors || '0' }}"

          # Set combined action taken
          if [[ "${{ inputs.check_only }}" == "true" ]]; then
            ACTION_TAKEN="Check only - no updates performed"
          elif [[ "${{ inputs.dry_run }}" == "true" ]]; then
            ACTION_TAKEN="Dry run completed"
          else
            ACTION_TAKEN="Rollout update completed (Companies: $COMPANIES_PROCESSED, Quotas: $QUOTAS_TOTAL)"
          fi

          # Create comprehensive summary
          cat > $GITHUB_STEP_SUMMARY << EOF
          # 🔄 BNetzA Rollout Update Results

          ## 📋 Update Overview
          - **Action Type**: ${{ inputs.dry_run == 'true' && 'Dry Run' || inputs.check_only == 'true' && 'Check Only' || inputs.force_update == 'true' && 'Forced Update' || 'Regular Update' }}
          - **Overall Result**: $ACTION_TAKEN

          ## 📥 Source File Upload
          - **Status**: ${{ needs.download-and-upload-sources.result == 'success' && '✅ Success' || needs.download-and-upload-sources.result == 'failure' && '❌ Failed' || needs.download-and-upload-sources.result == 'skipped' && '⏭️ Skipped' || '❓ Unknown' }}
          - **Release**: ${{ inputs.release_version || 'Not specified' }}

          ## 🏢 Company Update Results
          - **Status**: ${{ needs.company-update.result == 'success' && '✅ Success' || needs.company-update.result == 'failure' && '❌ Failed' || needs.company-update.result == 'skipped' && '⏭️ Skipped' || '❓ Unknown' }}
          - **Action**: $COMPANY_ACTION_TAKEN
          - **Companies Processed**: $COMPANIES_PROCESSED
          - **Companies Updated**: $COMPANIES_UPDATED
          - **New Companies Added**: $COMPANIES_NEW

          ## 📊 Quota Update Results
          - **Status**: ${{ needs.quota-update.result == 'success' && '✅ Success' || needs.quota-update.result == 'failure' && '❌ Failed' || needs.quota-update.result == 'skipped' && '⏭️ Skipped' || '❓ Unknown' }}
          - **Action**: $QUOTA_ACTION_TAKEN
          - **Total Quotas**: $QUOTAS_TOTAL
          - **Current Date**: $QUOTAS_CURRENT
          - **Outdated Date**: $QUOTAS_OUTDATED
          - **Validation Errors**: $QUOTAS_ERRORS

          ---
          *Updated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')*
          EOF

          # Set outputs
          echo "action_taken=$ACTION_TAKEN" >> $GITHUB_OUTPUT
          echo "companies_processed=$COMPANIES_PROCESSED" >> $GITHUB_OUTPUT
          echo "companies_updated=$COMPANIES_UPDATED" >> $GITHUB_OUTPUT
          echo "companies_new=$COMPANIES_NEW" >> $GITHUB_OUTPUT
          echo "quotas_total=$QUOTAS_TOTAL" >> $GITHUB_OUTPUT
