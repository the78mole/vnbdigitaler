name: CI/CD Local Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-local:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          uv sync --all-extras

      - name: Install coverage for Python 3.11
        if: matrix.python-version == '3.11'
        run: |
          uv add --dev coverage[toml]

      - name: Set test environment variables
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/test_db" # pragma: allowlist secret
        run: |
          echo "DATABASE_URL=$DATABASE_URL" >> $GITHUB_ENV

      - name: Run pre-commit checks
        run: |
          uv run pre-commit run --all-files

      - name: Run tests
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/test_db" # pragma: allowlist secret
        run: |
          if [ "${{ matrix.python-version }}" = "3.11" ]; then
            uv run coverage run -m pytest
            uv run coverage xml
          else
            uv run pytest
          fi

      - name: Show coverage report (local)
        if: matrix.python-version == '3.11'
        run: |
          echo "Coverage XML generated:"
          ls -la coverage.xml || echo "No coverage.xml found"
          echo "JUnit XML generated:"
          ls -la junit.xml || echo "No junit.xml found"

      - name: Upload coverage reports
        if: matrix.python-version == '3.11' && !env.ACT
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && !env.ACT }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
