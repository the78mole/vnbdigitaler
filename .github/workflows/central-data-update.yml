name: Central Data Update Workflows

on:
  # Täglich um 6:00 UTC (8:00 CEST) - alle automatischen Updates
  schedule:
    - cron: "0 6 * * *"

  # Manuell ausführbar mit Optionen
  workflow_dispatch:
    inputs:
      update_type:
        description: "Which update to run"
        required: true
        type: choice
        options:
          - "all"
          - "rollout-quotas"
          - "bdew-companies"
          - "check-only"
        default: "all"
      force_update:
        description: "Force update even if no changes detected"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Dry run - show what would be updated without making changes"
        required: false
        default: false
        type: boolean

jobs:
  # Job 1: Check for any updates
  check-all-updates:
    runs-on: ubuntu-latest
    outputs:
      should_run_rollout: ${{ steps.determine-updates.outputs.should_run_rollout }}
      should_run_bdew: ${{ steps.determine-updates.outputs.should_run_bdew }}
    steps:
      - name: Determine which updates to run
        id: determine-updates
        run: |
          UPDATE_TYPE="${{ github.event.inputs.update_type || 'all' }}"

          case "$UPDATE_TYPE" in
            "all")
              echo "should_run_rollout=true" >> $GITHUB_OUTPUT
              echo "should_run_bdew=true" >> $GITHUB_OUTPUT
              ;;
            "rollout-quotas")
              echo "should_run_rollout=true" >> $GITHUB_OUTPUT
              echo "should_run_bdew=false" >> $GITHUB_OUTPUT
              ;;
            "bdew-companies")
              echo "should_run_rollout=false" >> $GITHUB_OUTPUT
              echo "should_run_bdew=true" >> $GITHUB_OUTPUT
              ;;
            "check-only")
              echo "should_run_rollout=true" >> $GITHUB_OUTPUT
              echo "should_run_bdew=true" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "should_run_rollout=false" >> $GITHUB_OUTPUT
              echo "should_run_bdew=false" >> $GITHUB_OUTPUT
              ;;
          esac

  # Job 2: Update BNetzA Rollout Quotas
  update-rollout-quotas:
    needs: check-all-updates
    if: ${{ needs.check-all-updates.outputs.should_run_rollout == 'true' }}
    uses: ./.github/workflows/reusable-rollout-update.yml
    with:
      force_update: ${{ github.event.inputs.force_update == 'true' }}
      dry_run: ${{ github.event.inputs.dry_run == 'true' }}
      check_only: ${{ github.event.inputs.update_type == 'check-only' }}
    secrets:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # Job 3: Update BDEW Companies (Placeholder for future implementation)
  update-bdew-companies:
    needs: check-all-updates
    if: ${{ needs.check-all-updates.outputs.should_run_bdew == 'true' && github.event.inputs.update_type != 'check-only' }}
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder for BDEW update
        run: |
          echo "🏗️ BDEW companies update workflow not yet implemented"
          echo "This is a placeholder for future BDEW data source updates"
          echo ""
          echo "Planned features:"
          echo "- Download latest BDEW company data"
          echo "- Update companies table with new information"
          echo "- Merge with existing rollout company mappings"

  # Job 4: Create comprehensive summary
  create-summary:
    needs: [check-all-updates, update-rollout-quotas, update-bdew-companies]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Create workflow summary
        run: |
          cat > $GITHUB_STEP_SUMMARY << 'EOF'
          # 🔄 VNBdigitaler Data Update Summary

          ## Workflow Configuration
          - **Trigger**: ${{ github.event_name }}
          - **Update Type**: ${{ github.event.inputs.update_type || 'all (scheduled)' }}
          - **Force Update**: ${{ github.event.inputs.force_update || 'false' }}
          - **Dry Run**: ${{ github.event.inputs.dry_run || 'false' }}

          ## Update Results

          ### 📊 BNetzA Rollout Quotas
          ${{ needs.update-rollout-quotas.result == 'success' && '✅ **Success**' || needs.update-rollout-quotas.result == 'skipped' && '⏭️ **Skipped**' || '❌ **Failed**' }}
          - **Action**: ${{ needs.update-rollout-quotas.outputs.action_taken || 'Not executed' }}
          - **Updates Available**: ${{ needs.update-rollout-quotas.outputs.has_updates || 'Unknown' }}
          - **Companies Processed**: ${{ needs.update-rollout-quotas.outputs.companies_processed || '0' }}

          ### 🏢 BDEW Companies
          ${{ needs.update-bdew-companies.result == 'success' && '✅ **Success**' || needs.update-bdew-companies.result == 'skipped' && '⏭️ **Skipped**' || '❌ **Failed**' }}
          - **Status**: ${{ needs.update-bdew-companies.result == 'skipped' && 'Not implemented yet' || needs.update-bdew-companies.result }}

          ## Next Steps
          - 🌐 Check the [VNBdigitaler WebUI](https://your-webui-url.com) for updated data
          - 📋 Review rollout companies and quotas in the dashboard
          - 🔗 Use the BDEW linking functionality for new entries

          ## Monitoring
          - 📈 [Database Statistics](https://your-webui-url.com/stats)
          - 🗃️ [Rollout Companies](https://your-webui-url.com/rollout/)
          - 🏢 [BDEW Companies](https://your-webui-url.com/companies/)

          ---
          *Automated by GitHub Actions • Run ID: ${{ github.run_id }} • $(date '+%Y-%m-%d %H:%M:%S UTC')*
          EOF

  # Job 5: Handle failures and create issues
  handle-failure:
    needs: [update-rollout-quotas, update-bdew-companies]
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const rolloutStatus = '${{ needs.update-rollout-quotas.result }}';
            const bdewStatus = '${{ needs.update-bdew-companies.result }}';

            let failedJobs = [];
            if (rolloutStatus === 'failure') failedJobs.push('BNetzA Rollout Quotas Update');
            if (bdewStatus === 'failure') failedJobs.push('BDEW Companies Update');

            const issue_body = `## 🚨 VNBdigitaler Data Update Failed

            **Failed Jobs**: ${failedJobs.join(', ')}
            **Workflow Run**: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            **Trigger**: ${{ github.event_name }}
            **Branch**: ${{ github.ref }}
            **Commit**: ${{ github.sha }}

            ### Job Status Summary
            - **BNetzA Rollout Quotas**: ${rolloutStatus}
            - **BDEW Companies**: ${bdewStatus}

            ### Possible Causes
            - Database connection issues
            - External data source changes (BNetzA website, BDEW data)
            - Network connectivity problems
            - Data format or schema changes
            - Dependency or environment issues

            ### Recommended Actions
            1. 🔍 **Check the workflow logs** for detailed error messages
            2. 🗄️ **Verify database connectivity** and credentials
            3. 🧪 **Test the update scripts manually** using the test scripts
            4. 🌐 **Check external data sources** for changes or availability
            5. 📊 **Review recent data** for format or schema changes

            ### Manual Testing
            \`\`\`bash
            # Test rollout update locally
            ./test-update-workflow.sh --dry-run

            # Check specific components
            uv run python src/bnetza/rollout_report_updater.py --check-update --verbose
            \`\`\`

            ### Recovery Steps
            If the issue is resolved, you can:
            - Re-run the failed workflow manually
            - Wait for the next scheduled run (daily at 6:00 UTC)
            - Use the WebUI for manual data management

            ---
            *This issue was automatically created by the failed workflow on ${new Date().toISOString()}*`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Data Update Failure - ${new Date().toISOString().split('T')[0]}`,
              body: issue_body,
              labels: ['bug', 'automation', 'data-update', 'priority-high']
            });
