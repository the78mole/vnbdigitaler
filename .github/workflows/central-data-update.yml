name: Central Data Update Workflows

on:
  # Täglich um 6:00 UTC (8:00 CEST) - alle automatischen Updates
  schedule:
    - cron: "0 6 * * *"

  # Manuell ausführbar mit Optionen
  workflow_dispatch:
    inputs:
      update_type:
        description: "Which update to run"
        required: true
        type: choice
        options:
          - "all"
          - "rollout-quotas"
          - "bdew-companies"
          - "check-only"
        default: "all"
      force_update:
        description: "Force update even if no changes detected"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Dry run - show what would be updated without making changes"
        required: false
        default: false
        type: boolean

jobs:
  # Job 1: Update BNetzA Rollout Quotas (using new coordinated workflow)
  update-rollout-quotas:
    if: ${{ github.event.inputs.update_type == 'all' || github.event.inputs.update_type == 'rollout-quotas' || github.event.inputs.update_type == 'check-only' || github.event.inputs.update_type == '' }}
    uses: ./.github/workflows/reusable-rollout-update.yml
    with:
      force_update: ${{ github.event.inputs.force_update == 'true' }}
      dry_run: ${{ github.event.inputs.dry_run == 'true' }}
      check_only: ${{ github.event.inputs.update_type == 'check-only' }}
    secrets:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # Job 2: Update BDEW Companies (Placeholder for future implementation)
  update-bdew-companies:
    if: ${{ (github.event.inputs.update_type == 'all' || github.event.inputs.update_type == 'bdew-companies') && github.event.inputs.update_type != 'check-only' }}
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder for BDEW update
        run: |
          echo "🏗️ BDEW companies update workflow not yet implemented"
          echo "This is a placeholder for future BDEW data source updates"
          echo ""
          echo "Planned features:"
          echo "- Download latest BDEW company data"
          echo "- Update companies table with new information"
          echo "- Merge with existing rollout company mappings"

  # Job 3: Create release with semantic versioning
  create-release:
    needs: [update-rollout-quotas, update-bdew-companies]
    if: ${{ needs.update-rollout-quotas.result == 'success' && github.event.inputs.dry_run != 'true' && github.event.inputs.update_type != 'check-only' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.check-changes.outputs.has_changes }}
      version: ${{ steps.semantic-version.outputs.version_tag }}
      release_url: ${{ steps.create-release.outputs.url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check for meaningful changes
        id: check-changes
        run: |
          # Check if we have actual updates (not just "check-only" or "dry-run")
          COMPANIES_NEW="${{ needs.update-rollout-quotas.outputs.companies_new || '0' }}"
          COMPANIES_UPDATED="${{ needs.update-rollout-quotas.outputs.companies_updated || '0' }}"
          QUOTAS_TOTAL="${{ needs.update-rollout-quotas.outputs.quotas_total || '0' }}"

          if [[ "$COMPANIES_NEW" != "0" || "$COMPANIES_UPDATED" != "0" || "$QUOTAS_TOTAL" != "0" ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "🎯 Meaningful changes detected - will create release"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No meaningful changes detected - skipping release"
          fi

      - name: Determine semantic version
        id: semantic-version
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          major_pattern: "(BREAKING CHANGE|!:|!\\))"
          minor_pattern: "(feat:|refactor:|fix:)"
          version_format: "${major}.${minor}.${patch}"
          bump_each_commit: true
          search_commit_body: true

      - name: Download release assets from rollout update
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: actions/download-artifact@v5
        with:
          pattern: rollout-*
          merge-multiple: true
          path: release-assets

      - name: Prepare release assets
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          mkdir -p release-ready

          # Find and organize release files
          if [[ -d "release-assets" ]]; then
            echo "📁 Found release assets:"
            find release-assets -type f -name "*.xlsx" -o -name "*.csv" -o -name "*.json" | head -10

            # Copy Excel and CSV files to release directory
            find release-assets -name "*.xlsx" -exec cp {} release-ready/ \;
            find release-assets -name "*.csv" -exec cp {} release-ready/ \;
            find release-assets -name "*summary.json" -exec cp {} release-ready/ \;

            echo "📦 Release assets prepared:"
            ls -la release-ready/
          else
            echo "⚠️ No release assets found"
          fi

      - name: Generate release notes
        if: steps.check-changes.outputs.has_changes == 'true'
        id: release-notes
        run: |
          # Create comprehensive release notes from workflow summary
          cat > release-notes.md << EOF
          # VNBdigitaler Data Update Release ${{ steps.semantic-version.outputs.version_tag }}

          Automated data update release containing the latest BNetzA rollout quota information and company data.

          ## 📊 Update Summary

          ### BNetzA Rollout Quotas
          - **Action Taken**: ${{ needs.update-rollout-quotas.outputs.action_taken }}
          - **Companies Processed**: ${{ needs.update-rollout-quotas.outputs.companies_processed || '0' }}
          - **Companies Updated**: ${{ needs.update-rollout-quotas.outputs.companies_updated || '0' }}
          - **New Companies**: ${{ needs.update-rollout-quotas.outputs.companies_new || '0' }}
          - **Total Quota Records**: ${{ needs.update-rollout-quotas.outputs.quotas_total || '0' }}

          ### Data Files Included

          This release contains the following data files:

          EOF

          # List actual files that will be included
          if [[ -d "release-ready" && $(ls -A release-ready) ]]; then
            echo "📁 **Release Assets:**" >> release-notes.md
            for file in release-ready/*; do
              if [[ -f "$file" ]]; then
                filename=$(basename "$file")
                size=$(du -h "$file" | cut -f1)
                echo "- \`$filename\` ($size)" >> release-notes.md
              fi
            done
          else
            echo "ℹ️ **Note**: No data files available for this release." >> release-notes.md
          fi

          cat >> release-notes.md << EOF

          ## 🔧 Technical Details

          - **Workflow Run**: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          - **Trigger**: ${{ github.event_name }}${{ github.event.inputs.update_type && format(' ({0})', github.event.inputs.update_type) || '' }}
          - **Repository**: ${{ github.repository }}
          - **Branch**: ${{ github.ref_name }}
          - **Release Date**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')

          ## 📈 Data Quality

          This release contains validated data from official BNetzA sources:
          - Smart meter rollout quota reports
          - Company identification and BDEW linkage data
          - Time-series quota progression data

          ## 🔗 Integration

          To use this data in your applications:
          1. Download the CSV files for direct data integration
          2. Use the Excel files for manual analysis and reporting
          3. Import JSON summaries for metadata and statistics

          ---
          *Automated release created by VNBdigitaler Central Data Update System*
          EOF

          echo "release_notes_file=release-notes.md" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.check-changes.outputs.has_changes == 'true'
        id: create-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.semantic-version.outputs.version_tag }}
          name: "Data Update ${{ steps.semantic-version.outputs.version_tag }}"
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: |
            release-ready/*

  # Job 4: Create comprehensive summary
  create-summary:
    needs: [update-rollout-quotas, update-bdew-companies, create-release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Create comprehensive workflow summary
        run: |
          cat > $GITHUB_STEP_SUMMARY << EOF
          # 🔄 VNBdigitaler Central Data Update Summary

          ## 🔧 Workflow Configuration
          - **Trigger**: ${{ github.event_name }}
          - **Update Type**: ${{ github.event.inputs.update_type || 'all (scheduled)' }}
          - **Force Update**: ${{ github.event.inputs.force_update || 'false' }}
          - **Dry Run**: ${{ github.event.inputs.dry_run || 'false' }}

          ## 📊 Update Results

          ### BNetzA Rollout Quotas
          **Status**: ${{ needs.update-rollout-quotas.result == 'success' && '✅ Success' || needs.update-rollout-quotas.result == 'skipped' && '⏭️ Skipped' || needs.update-rollout-quotas.result == 'failure' && '❌ Failed' || '❓ Unknown' }}

          EOF

          # Add detailed rollout statistics if available
          if [[ "${{ needs.update-rollout-quotas.result }}" == "success" ]]; then
            cat >> $GITHUB_STEP_SUMMARY << EOF
          - **Action Taken**: ${{ needs.update-rollout-quotas.outputs.action_taken }}
          - **Companies Processed**: ${{ needs.update-rollout-quotas.outputs.companies_processed }}
          - **New Companies**: ${{ needs.update-rollout-quotas.outputs.companies_new }}
          - **Updated Companies**: ${{ needs.update-rollout-quotas.outputs.companies_updated }}
          - **Total Quota Records**: ${{ needs.update-rollout-quotas.outputs.quotas_total }}

          EOF
          fi

          cat >> $GITHUB_STEP_SUMMARY << EOF
          ### BDEW Companies
          **Status**: ${{ needs.update-bdew-companies.result == 'success' && '✅ Success' || needs.update-bdew-companies.result == 'skipped' && '⏭️ Skipped (Not implemented)' || needs.update-bdew-companies.result == 'failure' && '❌ Failed' || '❓ Unknown' }}

          ### Release Creation
          **Status**: ${{ needs.create-release.result == 'success' && '✅ Release Created' || needs.create-release.result == 'skipped' && '⏭️ Skipped (No changes)' || needs.create-release.result == 'failure' && '❌ Failed' || '❓ Unknown' }}

          EOF

          # Add release information if created
          if [[ "${{ needs.create-release.outputs.release_created }}" == "true" ]]; then
            cat >> $GITHUB_STEP_SUMMARY << EOF
          - **Version**: ${{ needs.create-release.outputs.version }}
          - **Release URL**: [${{ needs.create-release.outputs.version }}](${{ needs.create-release.outputs.release_url }})
          - **Assets**: Excel, CSV, and JSON data files included

          EOF
          fi

          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🎯 Next Steps

          EOF

          # Add context-specific next steps
          if [[ "${{ needs.update-rollout-quotas.result }}" == "success" && "${{ needs.update-rollout-quotas.outputs.companies_new }}" != "0" ]]; then
            cat >> $GITHUB_STEP_SUMMARY << EOF
          ### Immediate Actions Required
          - 🏢 **New Companies**: ${{ needs.update-rollout-quotas.outputs.companies_new }} new rollout companies need BDEW linking
          - 🔗 **WebUI Action**: Use the [Company Matching Interface](https://your-webui-url.com/matching) to link new companies

          EOF
          fi

          if [[ "${{ needs.create-release.outputs.release_created }}" == "true" ]]; then
            cat >> $GITHUB_STEP_SUMMARY << EOF
          ### Data Access
          - 📦 **Latest Release**: Download data files from [${{ needs.create-release.outputs.version }}](${{ needs.create-release.outputs.release_url }})
          - 📊 **Integration**: Use CSV files for programmatic access
          - 📈 **Analysis**: Use Excel files for manual analysis

          EOF
          fi

          cat >> $GITHUB_STEP_SUMMARY << EOF
          ### Regular Monitoring
          - 🌐 **Dashboard**: Check the [VNBdigitaler WebUI](https://your-webui-url.com) for updated data
          - 📈 **Statistics**: Review [Database Statistics](https://your-webui-url.com/stats)
          - 🗃️ **Rollout Data**: Monitor [Rollout Companies](https://your-webui-url.com/rollout/)
          - 🏢 **BDEW Data**: Check [BDEW Companies](https://your-webui-url.com/companies/)

          ## 🔧 Technical Details
          - **Workflow Run**: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          - **Repository**: ${{ github.repository }}
          - **Branch**: ${{ github.ref_name }}
          - **Timestamp**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')

          ---
          *VNBdigitaler Central Data Update Orchestrator • Run ID: ${{ github.run_id }}*
          EOF

  # Job 5: Handle failures and create issues (only for scheduled runs)
  handle-failure:
    needs: [update-rollout-quotas, update-bdew-companies, create-release]
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create comprehensive failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const rolloutStatus = '${{ needs.update-rollout-quotas.result }}';
            const bdewStatus = '${{ needs.update-bdew-companies.result }}';

            let failedJobs = [];
            if (rolloutStatus === 'failure') failedJobs.push('BNetzA Rollout Quotas');
            if (bdewStatus === 'failure') failedJobs.push('BDEW Companies');

            const rolloutStats = {
              companies_processed: '${{ needs.update-rollout-quotas.outputs.companies_processed }}' || '0',
              companies_new: '${{ needs.update-rollout-quotas.outputs.companies_new }}' || '0'
            };

            const issue_body = `## 🚨 VNBdigitaler Central Data Update Failed

            **Failed Components**: ${failedJobs.length > 0 ? failedJobs.join(', ') : 'Multiple systems'}
            **Workflow Run**: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            **Trigger**: Scheduled daily update (6:00 UTC)
            **Timestamp**: ${new Date().toISOString()}

            ### 📊 System Status Overview
            | Component | Status | Details |
            |-----------|--------|---------|
            | **BNetzA Rollout Quotas** | ${rolloutStatus === 'failure' ? '❌ Failed' : rolloutStatus === 'success' ? '✅ Success' : '⏭️ Skipped'} | Companies: ${rolloutStats.companies_processed}, New: ${rolloutStats.companies_new} |
            | **BDEW Companies** | ${bdewStatus === 'failure' ? '❌ Failed' : bdewStatus === 'success' ? '✅ Success' : '⏭️ Not Implemented'} | Placeholder component |

            ### 🔍 Impact Assessment
            The failure of the scheduled data update affects:
            - 📊 **Data Freshness**: Rollout quota data may be outdated
            - 🔗 **Integration**: New company linking may be incomplete
            - 🌐 **WebUI**: Dashboard statistics may not reflect latest data
            - 📈 **Reporting**: Analytics and reports may be stale

            ### 🛠️ Diagnostic Information
            **Possible Root Causes:**
            - **External Dependencies**: BNetzA website changes, network issues
            - **Database Problems**: Connection timeouts, schema changes, capacity issues
            - **Data Quality**: Format changes, validation failures, corrupted data
            - **Infrastructure**: Runner failures, timeout issues, resource constraints

            ### 📋 Recovery Procedures
            **Immediate Actions:**
            1. 🔍 **Review Logs**: Check detailed logs in the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            2. 🧪 **Manual Testing**: Run update scripts locally to reproduce issues
            3. 🔗 **Connectivity Check**: Verify database and external service access
            4. 📊 **Data Validation**: Check recent data for format consistency

            **Recovery Options:**
            - **Automatic Retry**: Next scheduled run is in 24 hours
            - **Manual Trigger**: Use workflow_dispatch with appropriate parameters
            - **Component Testing**: Test individual components separately
            - **Emergency Update**: Use WebUI for critical manual updates

            ### 🎯 Resolution Timeline
            - **Immediate**: Investigate and identify root cause
            - **Short-term**: Apply fixes and test resolution
            - **Long-term**: Monitor stability and improve error handling

            ### 📞 Escalation
            **Contact Information:**
            - Development Team: Check repository maintainers
            - System Status: Monitor [VNBdigitaler Dashboard](https://your-webui-url.com)
            - Emergency Procedures: Use manual data management via WebUI

            ---
            *Automated issue created by Central Data Update failure detection*
            *Issue ID: Scheduled-${new Date().toISOString().split('T')[0]}*`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Central Data Update System Failure - ${new Date().toISOString().split('T')[0]}`,
              body: issue_body,
              labels: ['bug', 'automation', 'data-update', 'system-failure', 'priority-critical']
            });
