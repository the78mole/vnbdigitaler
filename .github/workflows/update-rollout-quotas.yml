name: Update BNetzA Rollout Quotas

on:
  # Täglich um 6:00 UTC (8:00 CEST) prüfen
  schedule:
    - cron: "0 6 * * *"

  # Manuell ausführbar
  workflow_dispatch:
    inputs:
      force_update:
        description: "Force update even if no changes detected"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Dry run - show what would be updated without making changes"
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: "3.12"

jobs:
  update-quotas:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv sync

      - name: Configure database connection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          echo "Database configuration set from secrets"

      - name: Check for new rollout reports
        id: check-reports
        run: |
          # Erstelle ein Wrapper-Script für bessere Ausgabe-Kontrolle
          cat > check_reports.py << 'EOF'
          import subprocess
          import sys
          import json

          def run_check():
              try:
                  # Prüfe auf neue Reports
                  result = subprocess.run([
                      'uv', 'run', 'python',
                      'src/bnetza/rollout_report_updater.py',
                      '--check-update', '--verbose'
                  ], capture_output=True, text=True, cwd='.')

                  output = result.stdout + result.stderr

                  # Bestimme ob Updates verfügbar sind basierend auf Exit Code und Output
                  has_updates = result.returncode == 0 and "new reports available" not in output.lower()

                  # GitHub Actions Output setzen
                  print(f"::set-output name=has_updates::{str(has_updates).lower()}")
                  print(f"::set-output name=check_output::{output}")

                  print("=== CHECK REPORT OUTPUT ===")
                  print(output)
                  print("=== END OUTPUT ===")

                  return has_updates

              except Exception as e:
                  print(f"Error checking reports: {e}")
                  print("::set-output name=has_updates::false")
                  print(f"::set-output name=check_output::Error: {e}")
                  return False

          if __name__ == "__main__":
              has_updates = run_check()
              sys.exit(0 if has_updates else 1)
          EOF

          python check_reports.py

      - name: Run update (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "🔍 Running dry run..."
          uv run python src/bnetza/rollout_report_updater.py --dry-run --verbose

      - name: Run forced update
        if: ${{ github.event.inputs.force_update == 'true' && github.event.inputs.dry_run != 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          echo "🚀 Running forced update..."
          uv run python src/bnetza/rollout_report_updater.py --force-update --verbose

      - name: Run regular update
        if: ${{ steps.check-reports.outputs.has_updates == 'true' && github.event.inputs.force_update != 'true' && github.event.inputs.dry_run != 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          echo "📊 Running regular update..."
          uv run python src/bnetza/rollout_report_updater.py --verbose

      - name: Create summary
        if: always()
        run: |
          cat > $GITHUB_STEP_SUMMARY << 'EOF'
          # BNetzA Rollout Quotas Update

          ## Workflow Configuration
          - **Trigger**: ${{ github.event_name }}
          - **Force Update**: ${{ github.event.inputs.force_update || 'false' }}
          - **Dry Run**: ${{ github.event.inputs.dry_run || 'false' }}

          ## Check Results
          - **New reports available**: ${{ steps.check-reports.outputs.has_updates }}

          ## Actions Taken
          ${{ github.event.inputs.dry_run == 'true' && '- ✅ Dry run completed' || '' }}
          ${{ github.event.inputs.force_update == 'true' && '- ✅ Forced update completed' || '' }}
          ${{ steps.check-reports.outputs.has_updates == 'true' && github.event.inputs.force_update != 'true' && github.event.inputs.dry_run != 'true' && '- ✅ Regular update completed' || '' }}
          ${{ steps.check-reports.outputs.has_updates != 'true' && github.event.inputs.force_update != 'true' && github.event.inputs.dry_run != 'true' && '- ℹ️  No updates needed' || '' }}

          ## Next Steps
          - Check the [VNBdigitaler WebUI](https://your-webui-url.com) for updated data
          - Review the rollout companies and quotas in the dashboard

          ---
          *Automated by GitHub Actions • Last run: ${{ github.run_id }}*
          EOF

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issue_body = `## 🚨 BNetzA Rollout Quotas Update Failed

            **Workflow Run**: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            **Trigger**: ${{ github.event_name }}
            **Branch**: ${{ github.ref }}
            **Commit**: ${{ github.sha }}

            ### Details
            The automated BNetzA rollout quotas update workflow has failed. Please check the workflow logs for details.

            ### Possible Causes
            - Database connection issues
            - BNetzA website changes
            - Data format changes
            - Network connectivity problems

            ### Next Steps
            1. Check the workflow logs
            2. Verify database connectivity
            3. Test the rollout updater manually
            4. Check if BNetzA website structure has changed

            ---
            *This issue was automatically created by the failed workflow.*`;

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 BNetzA Rollout Quotas Update Failed - ${new Date().toISOString().split('T')[0]}`,
              body: issue_body,
              labels: ['bug', 'automation', 'rollout-quotas']
            });
