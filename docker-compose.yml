version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: vnbdigitaler-postgres
    environment:
      POSTGRES_DB: vnb_digitaler
      POSTGRES_USER: vnb_admin
      POSTGRES_PASSWORD: vnb_secure_password_2024 # pragma: allowlist secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vnb_admin -d vnb_digitaler"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: vnbdigitaler-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@vnbdigitaler.de
      PGADMIN_DEFAULT_PASSWORD: admin123 # pragma: allowlist secret
    ports:
      - "8080:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
