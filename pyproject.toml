[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vnbdigitaler"
version = "0.1.0"
description = "Streamlit app for German electricity grid operators (VNB) data"
readme = { text = "VNB Digitaler Streamlit App", content-type = "text/plain" }
license = { text = "MIT" }
authors = [{ name = "Daniel", email = "daniel@example.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.28.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.28.0",
    "alembic>=1.12.0",
    "pydantic>=2.4.0",
    "pydantic-settings>=2.0.0",
    "aiohttp>=3.9.0",
    "boto3>=1.34.0",
    "python-dotenv>=1.0.0",
    "mapbox-vector-tile",
    "pyproj",
    "geopandas",
    "matplotlib",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "httpx>=0.28.1",
    "openai>=1.99.9",
    "jinja2>=3.1.0",
    "psycopg2-binary>=2.9.0", # PostgreSQL adapter for Neon
    "openpyxl>=3.1.5",
    "beautifulsoup4>=4.13.4",
    "lxml>=6.0.0",
    "fuzzywuzzy>=0.18.0",
    "python-levenshtein>=0.27.1",
    "geopy>=2.4.1",
    "docopt-ng>=0.9.0",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.4.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "ruff>=0.12.9",
    "mypy>=1.5.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "bandit>=1.7.5",
    "pydocstyle>=6.3.0",
    "detect-secrets>=1.4.0",
    "safety>=2.3.0",
    "types-requests",
    "types-PyYAML",
    "coverage[toml]>=7.0.0",
]
ai = ["openai>=1.0.0", "anthropic>=0.3.0", "pdfplumber>=0.9.0"]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "pytest-mock>=3.11.0",
    "aiosqlite>=0.19.0",
]

[project.urls]
Homepage = "https://github.com/the78mole/vnbdigitaler"
Repository = "https://github.com/the78mole/vnbdigitaler"
Issues = "https://github.com/the78mole/vnbdigitaler/issues"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
# Target Python 3.11+
target-version = "py311"
line-length = 88

[tool.ruff.lint]
# Enable specific rule sets
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PL",  # pylint
    "RUF", # ruff-specific rules
]

# Ignore specific rules
ignore = [
    "E501",    # line-too-long (handled by black)
    "B008",    # do-not-perform-function-calls-in-argument-defaults
    "B904",    # raise-without-from-inside-except
    "PLR0913", # too-many-arguments
    "PLR0912", # too-many-branches
    "PLR0915", # too-many-statements
]

# Exclude directories
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    "*.egg-info",
    ".mypy_cache",
    ".pytest_cache",
    "migrations",
]

[tool.ruff.lint.per-file-ignores]
# Test files can have additional flexibility
"tests/**/*.py" = ["PLR2004", "S101", "ARG001"]
# Config files can have unused imports
"**/config.py" = ["F401"]
# Init files can have unused imports
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
force-sort-within-sections = true

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 15
max-returns = 8
max-statements = 60

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["src"]
known_third_party = ["streamlit", "pandas", "sqlalchemy", "pydantic"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# Per-module options
[[tool.mypy.overrides]]
module = ["streamlit.*", "pandas.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["src.data_loader"]
warn_unreachable = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "--junitxml=junit.xml",
    "-o",
    "junit_family=legacy",
    "--ignore=tests/archive",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

# Separate coverage configuration for 'coverage run' command
[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*", "*/__init__.py", "*/migrations/*"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
precision = 2

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.html]
directory = "htmlcov"

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = [
    "B101",
    "B601",
] # Skip assert_used and shell_injection for specific cases

[tool.pydocstyle]
convention = "google"
add_ignore = [
    "D100",  # Missing docstring in public module
    "D104",  # Missing docstring in public package
    "D105",  # Missing docstring in magic method
    "D107",  # Missing docstring in __init__
    "D200",  # One-line docstring should fit on one line
    "D212",  # Multi-line docstring summary should start at the first line
    "D403",  # First word of the first line should be properly capitalized
] # Missing docstrings in some cases + allow acronyms
# Allow technical acronyms and official abbreviations in docstring first words

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "mypy>=1.17.1",
    "pydocstyle>=6.3.0",
    "ruff>=0.12.9",
    "safety>=3.6.1",
]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "pytest-mock>=3.11.0",
]
