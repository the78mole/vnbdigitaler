# Pre-commit configuration for VNBdigitaler
repos:
  # General pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-case-conflict
      - id: check-docstring-first
      - id: debug-statements
        exclude: ^(src/|tools/bak/|.*archive/)

  # Python code formatting with black
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        args: [--line-length=88]
        exclude: ^(tools/bak/|.*archive/)

  # Import sorting with isort
  - repo: https://github.com/pycqa/isort
    rev: 9.0.1
    hooks:
      - id: isort
        args: [--profile=black, --line-length=88]
        exclude: ^(tools/bak/|.*archive/)

  # Linting with ruff (faster alternative to flake8)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.2
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        exclude: ^(tools/bak/|migrations/|tests/|.*archive/)

  # Type checking with mypy - Temporarily disabled for systematic cleanup
  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.17.1
  #   hooks:
  #     - id: mypy
  #       additional_dependencies:
  #         - types-requests
  #         - types-PyYAML
  #         - pydantic
  #         - sqlalchemy
  #       args: [--ignore-missing-imports]
  #       files: ^src/
  #       exclude: ^(tools/bak/|.*archive/)

  # Docstring style checking with pydocstyle - Temporarily relaxed for systematic cleanup
  - repo: https://github.com/pycqa/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        args: ["--convention=google", "--add-ignore=D100,D104,D105,D107,D200,D212,D403"]
        files: ^src/
        exclude: ^(tools/bak/|.*archive/)

  # Code formatting with Prettier
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [yaml, javascript, css, json, markdown, html]
        files: \.(js|jsx|ts|tsx|css|json|yaml|yml|md|html)$

  # Markdown linting - Skipped in act due to Node.js version requirements
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.45.0
    hooks:
      - id: markdownlint
        args: ["--fix"]
        exclude: ^.*archive/

  # Security checks with bandit
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        additional_dependencies: [pbr]
        args: [-ll]
        exclude: ^(tests/|tools/bak/|migrations/|.*archive/)

  # Security scanning for secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args:
          - --exclude-secrets=(sha256|SHA256|hash|checksum)
        exclude: |
          (?x)^(
            \.env\.template|
            \.streamlit/secrets\.toml\.template|
            docs/SECRETS_SETUP\.md|
            README\.md|
            CHECKLIST\.md|
            COPILOT_INSTRUCTIONS\.md|
            \.github/COPILOT_INSTRUCTIONS\.md|
            data/.*\.csv|
            tmp/.*|
            .*archive/.*|
          )$

  # Pytest with coverage checks
  - repo: local
    hooks:
      - id: pytest-coverage
        name: pytest with coverage check
        entry: bash -c 'uv run pytest --cov=src --cov-fail-under=60 --cov-report=term-missing:skip-covered --cov-report=xml -m "not slow" || true'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: pytest-full-coverage
        name: pytest full test suite with coverage
        entry: bash -c 'uv run pytest --cov=src --cov-fail-under=50 --cov-report=term-missing --cov-report=xml || true'
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: pytest-fast
        name: pytest fast tests only
        entry: bash -c 'uv run pytest -m "not slow and not integration" --maxfail=5 || true'
        language: system
        pass_filenames: false
        stages: [manual]

# Global configuration
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ""
  autoupdate_commit_msg: "[pre-commit.ci] pre-commit autoupdate"
  autoupdate_schedule: weekly
  skip: []
  submodules: false
