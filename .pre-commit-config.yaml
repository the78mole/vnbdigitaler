# Pre-commit configuration for VNBdigitaler
repos:
  # General pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-case-conflict
      - id: check-docstring-first
      - id: debug-statements
        exclude: ^(src/|tools/bak/)

  # Python code formatting with black
  - repo: https://github.com/psf/black
    rev: 23.7.0
    hooks:
      - id: black
        args: [--line-length=88]
        exclude: ^tools/bak/

  # Import sorting with isort
  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        args: [--profile=black, --line-length=88]
        exclude: ^tools/bak/

  # Linting with ruff (faster alternative to flake8)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        exclude: ^(tools/bak/|migrations/|tests/)

  # Type checking with mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.5.1
    hooks:
      - id: mypy
        additional_dependencies:
          - types-requests
          - types-PyYAML
          - pydantic
          - sqlalchemy
        args: [--ignore-missing-imports]
        files: ^src/
        exclude: ^tools/bak/

  # Docstring style checking with pydocstyle
  - repo: https://github.com/pycqa/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        args: ["--convention=google", "--add-ignore=D100,D104,D105,D403"]
        files: ^src/
        exclude: ^tools/bak/

  # YAML formatting
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.0.3
    hooks:
      - id: prettier
        types: [yaml]
        #exclude: |
        #  (?x)^(
        #    \.github/workflows/.*\.ya?ml|
        #    \.pre-commit-config\.yaml
        #  )$

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.37.0
    hooks:
      - id: markdownlint
        args: [--fix]
        exclude: |
          (?x)^(
            \.github/.*\.md
          )$

  # Security checks with bandit
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        additional_dependencies: [pbr]
        args: [-ll]
        exclude: ^(tests/|tools/bak/)

  # Security scanning for secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args:
          - --exclude-secrets=(sha256|SHA256|hash|checksum)
        exclude: |
          (?x)^(
            \.env\.template|
            \.streamlit/secrets\.toml\.template|
            docs/SECRETS_SETUP\.md|
            README\.md|
            CHECKLIST\.md|
            COPILOT_INSTRUCTIONS\.md|
            \.github/COPILOT_INSTRUCTIONS\.md|
            data/.*\.csv|
            tmp/.*|
          )$

# Global configuration
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ""
  autoupdate_commit_msg: "[pre-commit.ci] pre-commit autoupdate"
  autoupdate_schedule: weekly
  skip: []
  submodules: false
